# Supabase CLI configuration.
# Hosted workflow:  npx supabase link --project-ref <ref>  ->  npm run db:push:seed
# Local workflow (needs Docker): npx supabase start  ->  npx supabase db reset

project_id = "prolinker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"

[auth.sms]
# Phone OTP-ready: enable once an SMS provider (e.g. Twilio) is configured.
enable_signup = false
enable_confirmations = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30
